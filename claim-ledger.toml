[checks]
# Exact invocations that count as a full run of each check. No globs:
# "pytest*" also matches "pytest --version", which is a route to a
# false VERIFIED. A command that does not match exactly is not a check,
# and the claim lands as UNSUPPORTED — the safe direction.
python-suite = ["pytest", "pytest -q", "python -m pytest", "uv run pytest"]
js-suite     = ["npm test"]
types        = ["mypy src"]
lint         = ["ruff check ."]

[checks.scope]
# which files each check covers, for the freshness rule
python-suite = ["src/**/*.py", "tests/**/*.py"]
js-suite     = ["src/**/*.ts"]
types        = ["src/**/*.py"]
lint         = ["**/*"]

[checks.aliases]
# The words a report actually uses for a check, mapped to the check it means.
# Taken from real extractions: a claim that says "the unit test passed" names
# "unit test", which matches no id and no invocation, and would otherwise be
# UNSUPPORTED. Matching is case-insensitive.
"unit test"  = "python-suite"
"unit tests" = "python-suite"
"the tests"  = "python-suite"
"the suite"  = "python-suite"

[tiers]
# used in phase 1 to decide which actions are consequential enough
# that not mentioning them is worth reporting
HUMAN   = ["migrations/**", "deploy/**", "Bash(git push*)", "Bash(*rm -rf*)"]
LOW     = ["docs/**", "**/*.md"]
default = "REVIEW"

[extractor]
# OpenRouter's Anthropic-shaped endpoint. The address and the header are
# configuration, so that no ANTHROPIC_-named variable decides where a report
# is sent. Both x-api-key and bearer were verified to work there.
base_url         = "https://openrouter.ai/api/v1"
auth             = "x-api-key"
key_env          = "OPENROUTER_API_KEY"
# Provisional since 18 October 2026, when Morph's endpoint for the route pinned
# on 23 September, deepseek/deepseek-v4.1-flash, went down. No route measured
# clears phase 1, stronger models included. With the prompt extract-3 this one
# reaches recall 0.72 over the annotated corpus and loses 2 turns in 81, and
# its answers vary from call to call (DECISIONS).
model            = "mistralai/mistral-medium-3.1"
# Exactly one provider, fallbacks off: a recall figure measured across a
# shifting set of them means nothing. This is Mistral's zero-retention endpoint.
provider         = "mistral/zdr"
answer_shape     = "json_schema"
# A deadline, not a socket timeout, and it has to fit inside the turn budget
# below. 20s since 31 October 2026: at 12, the answer to a long report often
# came too late (DECISIONS). glm's slowest measured answer took 49.8s.
timeout_s        = 20
max_report_chars = 20000

[extractor.parameters]
# What this route takes, sent as written; a parameter a model refuses leaves
# the router with no endpoint at all, so the set belongs to the route. This
# model does not reason, so there is no thinking to switch off, and a seed was
# accepted and steadied nothing, so there is none.
temperature = 0

[budget]
# The pipeline's own wall clock: longer than the extractor's deadline above,
# which the loader checks, and shorter than the Stop hook's timeout in
# hooks/hooks.json, which is when the harness kills the process. The pipeline
# reports running out of time; a killed hook reports nothing at all.
turn_timeout_s = 23

[log]
max_command_chars = 2000

[gate]
enabled = false   # phase 2 flips this. Present from the start: the loader
                  # rejects unknown keys, so adding it later is a migration

[corpus]
capture = true
