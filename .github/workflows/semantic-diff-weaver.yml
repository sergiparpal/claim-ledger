name: semantic-diff-weaver

# Field test of semantic-diff-weaver. This repository pushes to main without pull requests, so it
# reviews each push, from the commit before it to its head: what the change does in behavior and
# what to test goes to the job summary, and the analysis is kept as an artifact so that each
# finding can be judged afterwards. Advisory only: nothing here gates a push.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    # A branch's first push has no commit before it to compare with.
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is required: the analyzer reads committed objects and never fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: weaver
        uses: sergiparpal/semantic-diff-weaver@6e5f5f77061dadb49f8f689e34c9ceb1f1561f8c # v0.19.0
        with:
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}
          include: |
            src/**/*.py
            tools/**/*.py
          comment: false
          baseline: none
          fail-on: none
      - name: Show the review in the job summary
        if: steps.weaver.outputs.analysis != ''
        env:
          ENVELOPE: ${{ steps.weaver.outputs.analysis }}
        run: >-
          python3 -c 'import json, os;
          print(json.load(open(os.environ["ENVELOPE"], encoding="utf-8"))["markdown"])'
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.weaver.outputs.analysis != ''
        with:
          name: semantic-diff-weaver-analysis
          path: ${{ steps.weaver.outputs.analysis }}
          retention-days: 90
